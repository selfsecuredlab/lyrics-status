name: Publish release

on:
  push:
    branches: [rust]
    paths: [src-tauri/tauri.conf.json]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' src-tauri/tauri.conf.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          jq -e --arg v "$version" '.version == $v' package.json >/dev/null
          jq -e --arg v "$version" '.version == $v and .packages[""].version == $v' package-lock.json >/dev/null
          python3 - "$version" <<'PYTHON'
          import sys
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text())
          package = manifest['package']
          assert package['version'] == sys.argv[1]
          assert any(p['name'] == package['name'] and p['version'] == sys.argv[1] for p in lock['package'])
          PYTHON
          grep -Fxq "## $tag" CHANGELOG.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/rust ]]
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == branch ]] && [[ $(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true) == false ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          else
            tagged_sha=$(awk 'END { print $1 }' <<< "$existing")
            [[ "$tagged_sha" == "$GITHUB_SHA" ]]
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  # Upload every platform bundle before making the release public.
  release:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            file

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'LyricsStatus ${{ needs.prepare.outputs.tag }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, release]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundles and publish release notes
        run: |
          set -euo pipefail
          release_notes() {
            awk -v heading="## $1" '$0 == heading { found=1; next } /^## / && found { exit } found { print }' CHANGELOG.md
          }
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size > 0) | .name')
          for suffix in x64-setup.exe universal.dmg amd64.AppImage amd64.deb x86_64.rpm; do
            grep -Fq "$suffix" <<< "$assets"
          done
          release_notes "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest

      - name: Backfill previous release notes
        if: env.RELEASE_TAG == 'v2.0.1'
        run: |
          set -euo pipefail
          for tag in v1.1.1 v2.0.0; do
            awk -v heading="## $tag" '$0 == heading { found=1; next } /^## / && found { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          done

  # Optional: notify the website repo so it can refresh its VirusTotal results.
  # Skips cleanly when WEBSITE_ACTIONS_TOKEN is not configured.
  website-refresh:
    name: Refresh website and VirusTotal results
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dispatch website refresh (optional)
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "WEBSITE_ACTIONS_TOKEN not configured; skipping optional website refresh."
            exit 0
          fi
          gh workflow run refresh-virustotal.yml \
            --repo selfsecuredlab/lyrics-status-website \
            --ref mai \
            -f "release_tag=${RELEASE_TAG}" \
          || echo "Optional website refresh could not be started; the app release is already published."
