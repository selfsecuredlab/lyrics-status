name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check optional website automation token
        id: website_token
        shell: pwsh
        env:
          WEBSITE_ACTIONS_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBSITE_ACTIONS_TOKEN)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host 'Website refresh will be skipped because WEBSITE_ACTIONS_TOKEN is not configured.'
          }
          else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Verify release version
        id: release_info
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable executable
        run: npm run dist:release

      - name: Verify files and create checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          $files = @(
            "release/LyricsStatus-Setup-$env:VERSION.exe",
            "release/LyricsStatus-Portable-$env:VERSION.exe"
          )

          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release file was not built: $file"
            }
          }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "release/LyricsStatus-Setup-$env:VERSION.exe",
            "release/LyricsStatus-Portable-$env:VERSION.exe",
            'release/SHA256SUMS.txt'
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "LyricsStatus $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }

      - name: Refresh website and VirusTotal results
        if: steps.website_token.outputs.configured == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
        run: |
          gh workflow run refresh-virustotal.yml `
            --repo selfsecuredlab/lyrics-status-website `
            --ref main `
            -f "release_tag=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not start the optional website refresh; the app release has already been published.'
          }
