name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the Tauri app on each OS and publish the bundles to a GitHub Release.
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            file

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LyricsStatus ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Optional: notify the website repo so it can refresh its VirusTotal results.
  # Skips cleanly when WEBSITE_ACTIONS_TOKEN is not configured.
  website-refresh:
    name: Refresh website and VirusTotal results
    needs: release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dispatch website refresh (optional)
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "WEBSITE_ACTIONS_TOKEN not configured; skipping optional website refresh."
            exit 0
          fi
          gh workflow run refresh-virustotal.yml \
            --repo selfsecuredlab/lyrics-status-website \
            --ref mai \
            -f "release_tag=${GITHUB_REF_NAME}" \
          || echo "Optional website refresh could not be started; the app release is already published."
