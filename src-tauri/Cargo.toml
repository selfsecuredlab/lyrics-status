[package]
name = "lyricsstatus"
version = "1.1.1"
description = "Display Spotify lyrics as your Discord status"
authors = ["selfsecured"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri drives; main.rs is a thin launcher.
[lib]
name = "lyricsstatus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lyricsstatus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
regex = "1"
base64 = "0.22"
aes-gcm = "0.10"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
urlencoding = "2"
once_cell = "1"
log = "0.4"

[profile.release]
# Small, fast binary — this is the whole point of the Rust port.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
